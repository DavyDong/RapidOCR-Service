<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RapidOCR · 图片与 PDF 文字识别</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><a class="brand" href="/">Rapid<span>OCR</span></a><a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a></header>
  <main>
    <div class="intro"><div class="eyebrow">图片 / PDF → 文字</div><h1>让文档中的文字，<br>变得触手可及。</h1><p>上传图片或 PDF，自动提取文字；扫描页也能识别，并保留每页文字位置。</p></div>
    <section class="workspace" aria-label="图片与 PDF 文字识别">
      <div class="panel upload-panel">
        <div class="panel-title"><h2>原始文件</h2><span id="file-name">等待上传</span></div>
        <div class="token-field">
          <label for="access-token">访问令牌</label>
          <input id="access-token" type="password" placeholder="输入 ACCESS_TOKEN" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="token-help">
          <small id="token-help">识别前输入令牌，不会保存到浏览器存储。</small>
        </div>
        <label class="dropzone" id="dropzone" for="image-file" tabindex="0">
          <span class="upload-icon" aria-hidden="true">↑</span><strong>点击选择，或拖入图片 / PDF</strong><span>PNG、JPEG、WebP、BMP、TIFF、PDF<br>最大 10 MB · PDF 最多 20 页</span>
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff,application/pdf,.pdf,.tif,.tiff">
        </label>
        <div id="preview-wrap" hidden><img id="preview" alt="待识别的图片"></div>
        <div id="document-preview" hidden><strong id="document-kind">PDF 文档已就绪</strong><span>识别后可按页查看文字。</span></div>
        <label class="ocr-option"><input type="checkbox" id="force-ocr"> 全部 PDF 页面使用 OCR <small>文字层有误时可开启，耗时更长。</small></label>
        <div class="actions"><button type="button" id="recognize" disabled>开始识别 <span aria-hidden="true">↗</span></button><button type="button" class="secondary" id="sample">示例图片</button><button type="button" class="secondary" id="sample-pdf">示例 PDF</button></div>
        <p class="note">文件仅用于当前识别，不保存上传文件。图片最多 2400 万像素；加密 PDF 请先解密。</p>
      </div>
      <div class="panel result-panel">
        <div class="panel-title"><h2>识别结果</h2><span id="metrics">准备就绪</span></div>
        <p id="status" role="status" aria-live="polite">识别完成后，文字会显示在这里。</p>
        <label id="page-controls" hidden>查看页面 <select id="page-select" aria-label="查看页面"></select></label>
        <textarea id="result" aria-label="识别出的文字" placeholder="文字结果" spellcheck="false" readonly></textarea>
        <div class="actions"><button type="button" class="secondary" id="copy" disabled>复制文字</button><button type="button" class="secondary" id="download" disabled>下载 JSON</button></div>
      </div>
    </section>
    <footer><span>RapidOCR · PP-OCRv6</span><span><a href="https://github.com/DavyDong/RapidOCR-Service" target="_blank" rel="noopener">开源代码 ↗</a> · <a href="https://github.com/DavyDong/RapidOCR-Service/blob/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a></span></footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
